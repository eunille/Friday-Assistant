# Friday Assistant Configuration
assistant:
  name: "Friday"
  wake_word: "hey_jarvis"
  personality: "iron_man"  # witty, confident, helpful

# Speech-to-Text
stt:
  model: "small"            # tiny | base | small | medium | large-v3
  language: "en"
  vad_filter: true          # Silero VAD — detects when you stop speaking
  beam_size: 1              # 1 = fast (greedy), 5 = accurate (beam search)
  silence_timeout: 1.5      # seconds of silence before processing

# Text-to-Speech
tts:
  provider: "auto"          # auto | elevenlabs | piper
                            # auto = try ElevenLabs first, fall back to Piper on failure
                            # elevenlabs = ElevenLabs only (no fallback)
                            # piper = Piper only
  voice: "en_US-ryan-medium"     # Piper voice model (male) — used when provider=piper or as fallback
  speed: 1.0                   # 0.5 = slow, 1.0 = normal, 1.5 = fast — Piper only
  friday_speed: 0.95            # ElevenLabs playback speed (0.8-1.2, lower = slower, more deliberate)
                            # 0.95 = 5% slower for subtle AI assistant feel
                            # 1.0 = normal speed

# Wake Word
wake_word:
  engine: "openwakeword"    # openwakeword | porcupine
  sensitivity: 0.5          # 0.0–1.0 (higher = more sensitive, more false positives)
  # porcupine_access_key: ""  # Only if using Porcupine

# LLM (Conversational AI Brain)
llm:
  engine: "ollama"          # ollama | none
  model: "qwen3:1.7b"        # qwen3:1.7b (~1.1GB) — fast for voice, good enough for chat
  num_ctx: 1024              # Context window (lower = less RAM, 1024 fine for voice)
  num_predict: 150           # Max response tokens (keeps voice responses snappy)
  conversation_memory: 10    # Max messages in conversation deque (5 exchanges)
  # model: "qwen3:4b"       # Alternative: 4B, ~2.5GB — better summaries, slower
  # model: "phi3:mini"      # Alternative: 3.8B, ~2.2GB — needs `ollama pull`

# Browser Automation
browser:
  executable: "/usr/bin/brave-browser"  # Brave | null = Playwright's Chromium
  search_url: "https://duckduckgo.com/?q={query}"  # Default engine for automated search (avoids Google CAPTCHA)
  tile_left: true   # Set true to auto-snap browser to left half on launch (requires xdotool or KDE KWin)
  page_load_timeout: 10000    # ms — max time to wait for page load
  action_timeout: 8000        # ms — max time for search/click/back actions
  js_render_wait: 1500        # ms — wait for JS-heavy pages to render
  max_page_chars: 2000        # max chars extracted from page text
  max_search_results: 5       # max Google search results to extract
  max_visit_chars: 3000       # max chars from visited page

# Website Shortcuts
